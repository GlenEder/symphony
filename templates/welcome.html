{{define "title"}}Welcome — Maestro{{end}}
{{define "page-content"}}<section class="hero"><h1>What would you like to plan?</h1><p>Describe the change, feature, or problem. Maestro will research the codebase and guide you through the decisions.</p><form id="start-form"><textarea id="prompt" name="prompt" rows="7" placeholder="I want to plan..." required></textarea><button type="submit">Start planning</button></form><p id="status" role="status"></p><button id="retry" type="button" hidden>Retry</button><section id="wizard" hidden><p id="progress"></p><h2 id="question"></h2><div id="options"></div><form id="answer-form"><input id="custom" maxlength="4000" placeholder="Or type your answer"><button>Answer</button></form></section><pre id="context" hidden></pre></section><script>
const form=document.getElementById('start-form'), wizard=document.getElementById('wizard'), answerForm=document.getElementById('answer-form'), custom=document.getElementById('custom'), retry=document.getElementById('retry'); let session,socket;
function render(s){session=s;if(!s)return;if(s.state==='reviewing'){location.href='/plan/'+encodeURIComponent(s.id);return;}status.textContent=s.state==='failed'?`Failed: ${s.error||'unknown error'}`:s.state==='researching'?'Researching your codebase…':s.state==='grilling'?'Answer the next question.':s.state==='generating'?'Grilling complete. Preparing the plan…':s.state;retry.hidden=s.state!=='failed';context.textContent=s.context||'';context.hidden=!context.textContent; const q=s.question; wizard.hidden=s.state!=='grilling'||!q||q.answered;if(q&&s.state==='grilling'){progress.textContent=`Question ${q.current||1} of ${q.total_questions}`;question.textContent=q.question||'';options.replaceChildren(...(q.options||[]).map(x=>{const b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>sendAnswer(x);return b;}));custom.hidden=!q.allow_custom;}}
async function sendAnswer(a){if(!a.trim())return;await fetch(`/api/session/${encodeURIComponent(session.id)}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:a})});custom.value='';}
answerForm.onsubmit=e=>{e.preventDefault();sendAnswer(custom.value)};
retry.onclick=async()=>{const r=await fetch(`/api/session/${encodeURIComponent(session.id)}/retry`,{method:'POST'});if(r.ok)connect(await r.json())};
function connect(s){render(s);const scheme=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${scheme}//${location.host}/ws/session/${encodeURIComponent(s.id)}`);socket.onmessage=e=>{const payload=JSON.parse(e.data);render(payload.session||payload)};socket.onclose=()=>setTimeout(()=>fetch(`/api/session/${s.id}`).then(x=>x.json()).then(connect),1000);}
form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/session/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt.value})});connect(await r.json());};
</script>{{end}}
