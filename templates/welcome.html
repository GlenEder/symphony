{{define "title"}}Welcome — Maestro{{end}}
{{define "page-content"}}<section class="hero"><h1>What would you like to plan?</h1><p>Describe the change, feature, or problem. Maestro will research the codebase and guide you through the decisions.</p><form id="start-form"><textarea id="prompt" name="prompt" rows="7" placeholder="I want to plan..." required></textarea><button type="submit">Start planning</button></form><p id="status" role="status"></p><button id="retry" type="button" hidden>Retry</button><section id="wizard" hidden><p id="progress"></p><h2 id="question"></h2><div id="options"></div><form id="answer-form"><input id="custom" maxlength="4000" placeholder="Or type your answer"><button>Answer</button></form></section><pre id="context" hidden></pre></section><script>
const form=document.getElementById('start-form'), promptEl=document.getElementById('prompt'), statusEl=document.getElementById('status'), wizard=document.getElementById('wizard'), progressEl=document.getElementById('progress'), questionEl=document.getElementById('question'), optionsEl=document.getElementById('options'), answerForm=document.getElementById('answer-form'), customEl=document.getElementById('custom'), contextEl=document.getElementById('context'), retry=document.getElementById('retry'); let session,socket;
function render(s){session=s;if(!s)return;if(s.state==='reviewing'){location.href='/plan/'+encodeURIComponent(s.id);return;}const q=s.question;const busy=s.state==='grilling'&&(!q||q.answered);statusEl.textContent=s.state==='failed'?`Failed: ${s.error||'unknown error'}`:s.state==='researching'?'Researching your codebase…':s.state==='grilling'?(busy?'Preparing next question…':'Answer the next question.'):s.state==='generating'?'Grilling complete. Preparing the plan…':s.state;retry.hidden=s.state!=='failed';contextEl.textContent=s.context||'';contextEl.hidden=!contextEl.textContent;wizard.hidden=s.state!=='grilling'||busy;if(q&&s.state==='grilling'&&!busy){progressEl.textContent=`Question ${q.current||1} of ${q.total_questions}`;questionEl.textContent=q.question||'';optionsEl.replaceChildren(...(q.options||[]).map(x=>{const b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>sendAnswer(x);return b;}));customEl.hidden=!q.allow_custom;}}
async function sendAnswer(a){if(!a.trim())return;await fetch(`/api/session/${encodeURIComponent(session.id)}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:a})});customEl.value='';}
answerForm.onsubmit=e=>{e.preventDefault();sendAnswer(customEl.value)};
retry.onclick=async()=>{const r=await fetch(`/api/session/${encodeURIComponent(session.id)}/retry`,{method:'POST'});if(r.ok)connect(await r.json())};
function connect(s){render(s);const scheme=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${scheme}//${location.host}/ws/session/${encodeURIComponent(s.id)}`);socket.onmessage=e=>{const payload=JSON.parse(e.data);render(payload.session||payload)};socket.onclose=()=>setTimeout(()=>fetch(`/api/session/${s.id}`).then(x=>x.json()).then(connect),1000);}
form.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/session/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:promptEl.value})});connect(await r.json());};
</script>{{end}}
